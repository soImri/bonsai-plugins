<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FEATURE — preview</title>
<style>
:root{color-scheme:light;--ink:#202c27;--paper:#eff3e9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:48px 24px}h1{font-size:clamp(32px,5vw,64px);font-weight:450;letter-spacing:-.04em;margin:0 0 16px}p{line-height:1.5;max-width:55ch}nav{display:flex;gap:12px;margin:24px 0}button{font:inherit;min-height:44px;padding:10px 18px;border:1px solid #768479;border-radius:24px;color:var(--ink);background:transparent;cursor:pointer}button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}.stage{padding:clamp(16px,4vw,48px);background:linear-gradient(125deg,#384b40,#202c27);border-radius:20px;color:var(--paper)}.recording{overflow:auto}.recording:focus-visible{outline:3px solid var(--paper)}img{display:block;width:100%;height:auto;border-radius:8px}ol{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:24px;padding-left:24px;margin:32px 0 0}li{padding-left:4px}li p{margin-bottom:0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:600px){main{padding:28px 16px}.recording img{width:600px;max-width:none}}
</style>
</head>
<body>
<main><h1>FEATURE</h1><p>DESCRIPTION: what you get, and how to trigger it.</p>
<nav aria-label="Recording controls"><button id="replay" type="button">Replay</button><button id="play" type="button" aria-pressed="false">Play animation</button></nav>
<section class="stage" aria-label="FEATURE walkthrough"><div class="recording" role="region" aria-label="Scrollable recording" tabindex="0"><img id="preview" src="assets/poster.png" alt="ALT: the real flow and its outcome."></div>
<ol><li><strong>STEP</strong><p>One short sentence.</p></li><li><strong>STEP</strong><p>One short sentence.</p></li><li><strong>STEP</strong><p>One short sentence.</p></li><li><strong>STEP</strong><p>One short sentence.</p></li></ol></section><p class="sr" id="status" role="status"></p></main>
<img id="animation-source" src="assets/preview.gif" hidden alt="">
<script>
(()=>{'use strict';const image=document.querySelector('#preview'),play=document.querySelector('#play'),replay=document.querySelector('#replay'),reduced=matchMedia('(prefers-reduced-motion: reduce)');
const poster=image.getAttribute('src');let objectURL,playing=false;
const sync=()=>{image.src=playing?document.querySelector('#animation-source').src:poster;play.setAttribute('aria-pressed',String(playing));play.textContent=playing?'Pause animation':'Play animation';};
const restart=async()=>{playing=true;const source=document.querySelector('#animation-source').src;const response=await fetch(source);if(!response.ok)throw new Error('Recording asset could not load');const blob=await response.blob();if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(blob);sync();image.src=objectURL;document.querySelector('#status').textContent='Recording restarted.';};
play.addEventListener('click',()=>{playing=!playing;sync();});replay.addEventListener('click',()=>restart().catch(()=>{playing=false;sync();document.querySelector('#status').textContent='Could not replay. Check the recording file.';}));reduced.addEventListener('change',()=>{if(reduced.matches){playing=false;sync();}});playing=!reduced.matches;sync();})();
</script>
</body></html>
